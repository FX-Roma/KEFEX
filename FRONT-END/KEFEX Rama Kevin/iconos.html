<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KEFEX - Ecosistema Inteligente</title>


    <!-- CSS Principal -->
    <link rel="stylesheet" href="style.css">


    <!-- Font Awesome 6.6.0 -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
        integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    >

</head>


<body>


    <!-- HEADER / NAVBAR GLOBAL-->

    <header class="header-home-page">


        <div class="container-home-page">


            <!-- ACCIONES -->

            <div class="acciones">


                <!--  NOTIFICACIONES -->

                <div class="icono-menu">

                    <button
                        class="icono"
                        id="btnNotificaciones"
                        type="button"
                    >
                        
                    </button>


                    <div
                        class="mini-menu"
                        id="menuNotificaciones"
                    >

                        <h3>
                             Notificaciones
                        </h3>


                        <div class="mini-item">
                            🛍️ Nuevo producto disponible
                        </div>


                        <div class="mini-item">
                            ❤️ Tu favorito bajó de precio
                        </div>


                        <div class="mini-item">
                            🎁 Tienes una oferta especial
                        </div>


                        <button type="button">
                            Ver todas
                        </button>

                    </div>

                </div>



                <!-- FAVORITOS -->

                <div class="icono-menu">

                    <button
                        class="icono"
                        id="btnFavoritos"
                        type="button"
                    >
                        ❤️
                    </button>


                    <div
                        class="mini-menu"
                        id="menuFavoritos"
                    >

                        <h3>
                            ❤️ Favoritos
                        </h3>


                        <div class="mini-producto">

                            <span>
                                🎧
                            </span>


                            <div>

                                <strong>
                                    Audífonos
                                </strong>

                                <small>
                                    $89.900
                                </small>

                            </div>

                        </div>


                        <div class="mini-producto">

                            <span>
                                ⌚
                            </span>


                            <div>

                                <strong>
                                    Smartwatch
                                </strong>

                                <small>
                                    $159.900
                                </small>

                            </div>

                        </div>


                        <button type="button">
                            Ver favoritos
                        </button>

                    </div>

                </div>



                <!-- CARRITO -->

                <div class="icono-menu">

                    <button
                        class="icono"
                        id="btnCarrito"
                        type="button"
                    >
                        🛒
                    </button>


                    <div
                        class="mini-menu"
                        id="menuCarrito"
                    >

                        <h3>
                            🛒 Mi carrito
                        </h3>


                        <div class="mini-producto">

                            <span>
                                🎧
                            </span>


                            <div>

                                <strong>
                                    Audífonos
                                </strong>

                                <small>
                                    $89.900
                                </small>

                            </div>

                        </div>


                        <div class="mini-producto">

                            <span>
                                ⌨️
                            </span>


                            <div>

                                <strong>
                                    Teclado
                                </strong>

                                <small>
                                    $129.900
                                </small>

                            </div>

                        </div>


                        <div class="mini-total">

                            <span>
                                Total
                            </span>

                            <strong>
                                $219.800
                            </strong>

                        </div>


                        <button type="button">
                            Ver carrito
                        </button>

                    </div>

                </div>


            </div>
            <!-- FIN .acciones -->


        </div>
        <!-- FIN .container-home-page -->


    </header>
    <!-- FIN HEADER -->



    <!-- JAVASCRIPT -->

    <script src="javascript.js"></script>


</body>

</html>
